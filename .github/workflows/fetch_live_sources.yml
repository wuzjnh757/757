name: Fetch Live Sources

on:
  schedule:
    # 每 10 分钟运行一次
    - cron: "*/10 * * * *"
  workflow_dispatch:  # 允许手动触发

jobs:
  update-live-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch live sources
        run: |
          python << 'EOF'
          import requests, time
          url = "http://api.hclyz.com/mf/json.txt"
          save_path = "live_sources.txt"
          try:
              response = requests.get(url, timeout=10)
              response.encoding = 'utf-8'
              if response.status_code == 200:
                  with open(save_path, "w", encoding="utf-8") as f:
                      f.write(response.text)
                  print(f"[{time.strftime('%Y-%m-%d %H:%M:%S')}] 已成功抓取并保存直播源到 {save_path}")
              else:
                  print(f"请求失败，状态码：{response.status_code}")
          except Exception as e:
              print(f"抓取出错：{e}")
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_sources.txt
          git commit -m "自动更新直播源 $(date '+%Y-%m-%d %H:%M:%S')" || echo "没有变化，无需提交"
          git push
